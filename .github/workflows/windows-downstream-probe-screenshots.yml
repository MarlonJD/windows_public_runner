name: Windows downstream probe screenshots

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: EMSI monorepo ref to capture
        required: false
        default: main
      qa_label:
        description: emsi_qa destination label
        required: false
        default: downstream-probe

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  capture:
    name: Capture downstream probe screenshots
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      EMSI_EVIDENCE_ROOT: ${{ github.workspace }}\_emsi-downstream-probe-evidence
      EMSI_SOURCE_REF: ${{ inputs.source_ref }}
      EMSI_QA_LABEL: ${{ inputs.qa_label }}
    steps:
      - name: Checkout runner harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout EMSI source
        uses: actions/checkout@v4
        with:
          repository: MarlonJD/emsi_monorepo
          ref: ${{ inputs.source_ref }}
          path: work/emsi
          ssh-key: ${{ secrets.EMSI_SOURCE_SSH_KEY }}
          persist-credentials: false

      - name: Checkout QA evidence repository
        uses: actions/checkout@v4
        with:
          repository: MarlonJD/emsi_qa
          path: work/emsi_qa
          ssh-key: ${{ secrets.EMSI_QA_SSH_KEY }}
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore required EMSI submodules
        working-directory: work/emsi
        run: |
          git submodule update --init tools/winui3-mac-test-runtime
          git -C tools/winui3-mac-test-runtime fetch origin main
          git -C tools/winui3-mac-test-runtime checkout origin/main

      - name: Install Windows App Runtime 1.7
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall-x64.exe"
          Invoke-WebRequest `
            -Uri "https://aka.ms/windowsappsdk/1.7/1.7.250401001/windowsappruntimeinstall-x64.exe" `
            -OutFile $installer

          & $installer --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App Runtime installer failed with exit code $LASTEXITCODE."
          }

      - name: Patch downstream probe native XAML compatibility
        working-directory: work/emsi
        run: |
          $mainWindow = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/MainWindow.xaml"
          $xaml = Get-Content $mainWindow -Raw
          $xaml = $xaml -replace '(?s)\s*<Window\.Resources>.*?</Window\.Resources>', ''
          $xaml = $xaml -replace '\{ThemeResource AppBackgroundBrush\}', '#F7F8FA'
          Set-Content -Path $mainWindow -Value $xaml -Encoding UTF8

          $appXamlPath = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/App.xaml"
          $appXaml = Get-Content $appXamlPath -Raw
          $appXaml = $appXaml -replace '</Application>', @'
              <Application.Resources>
                  <ResourceDictionary>
                      <ResourceDictionary.MergedDictionaries>
                          <XamlControlsResources xmlns="using:Microsoft.UI.Xaml.Controls" />
                      </ResourceDictionary.MergedDictionaries>
                  </ResourceDictionary>
              </Application.Resources>
          </Application>
          '@
          Set-Content -Path $appXamlPath -Value $appXaml -Encoding UTF8

          $appCodePath = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/App.xaml.cs"
          $appCode = Get-Content $appCodePath -Raw
          $appCode = $appCode -replace "public sealed partial class App : Application`r?`n\{", "public sealed partial class App : Application`n{`n    private Window? mainWindow;`n"
          $appCode = $appCode -replace "        InitializeComponent\(\);", @'
                  var launchLog = Environment.GetEnvironmentVariable("WINUI3_MAC_NATIVE_LAUNCH_LOG") ?? "native-launch.log";
                  void LogLaunchFailure(string message)
                  {
                      try
                      {
                          File.AppendAllText(launchLog, message + Environment.NewLine);
                      }
                      catch
                      {
                          // Best-effort diagnostics only.
                      }
                  }

                  AppDomain.CurrentDomain.UnhandledException += (_, eventArgs) =>
                      LogLaunchFailure("AppDomain.UnhandledException: " + eventArgs.ExceptionObject);
                  UnhandledException += (_, eventArgs) =>
                      LogLaunchFailure("Application.UnhandledException: " + eventArgs.Exception);

                  InitializeComponent();
          '@
          $appCode = $appCode -replace "        MainWindow = window;`r?`n", "        mainWindow = window;`n"
          $appCode = $appCode -replace "        var scenarioPath = TryReadScenarioPath\(args\.Arguments \?\? string\.Empty\);`r?`n        if \(!string\.IsNullOrWhiteSpace\(scenarioPath\)\)`r?`n        \{`r?`n            window\.ApplyScenario\(scenarioPath\);`r?`n        \}", @'
                  LogLaunchFailure("LaunchArguments=" + (args.Arguments ?? string.Empty));
                  var scenarioPath = TryReadScenarioPath(args.Arguments ?? string.Empty);
                  LogLaunchFailure("ScenarioPath=" + (scenarioPath ?? "<none>"));
                  if (!string.IsNullOrWhiteSpace(scenarioPath))
                  {
                      window.DispatcherQueue.TryEnqueue(async () =>
                      {
                          await System.Threading.Tasks.Task.Delay(500);
                          window.ApplyScenario(scenarioPath);
                      });
                  }
          '@
          Set-Content -Path $appCodePath -Value $appCode -Encoding UTF8

          $mainWindowCodePath = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/MainWindow.xaml.cs"
          $mainWindowCode = @'
          using MeetingChallenge.WinUI.MacRuntimeProbe.Pages;
          using Microsoft.UI.Xaml;
          using Microsoft.UI.Xaml.Controls;
          using System.Text.Json;

          namespace MeetingChallenge.WinUI.MacRuntimeProbe;

          public sealed partial class MainWindow : Window
          {
              private bool isStaff;

              public MainWindow()
              {
                  InitializeComponent();
                  SignedOutFrame.Navigate(typeof(LoginProbePage), this);
                  ShowSignedOut();
              }

              public void SignInAsStaff()
              {
                  isStaff = true;
                  SignedOutFrame.Visibility = Visibility.Collapsed;
                  RootNavigation.Visibility = Visibility.Visible;
                  AdminNavigationItem.Visibility = Visibility.Visible;
                  AdminWorkbenchNavigationItem.Visibility = Visibility.Visible;
                  RootNavigation.SelectedItem = HomeNavigationItem;
                  Navigate("home");
              }

              public void ApplyScenario(string scenarioPath)
              {
                  LogScenario("ApplyScenario=" + scenarioPath);
                  if (!File.Exists(scenarioPath))
                  {
                      LogScenario("ScenarioMissing=" + scenarioPath);
                      return;
                  }

                  using var document = JsonDocument.Parse(File.ReadAllText(scenarioPath));
                  if (!document.RootElement.TryGetProperty("interactions", out var interactions) ||
                      interactions.ValueKind != JsonValueKind.Array)
                  {
                      LogScenario("ScenarioInteractions=0");
                      return;
                  }

                  string? expectedRoute = null;
                  var interactionCount = 0;
                  foreach (var interaction in interactions.EnumerateArray())
                  {
                      interactionCount++;
                      var type = interaction.TryGetProperty("type", out var typeElement)
                          ? typeElement.GetString()
                          : null;
                      var target = interaction.TryGetProperty("target", out var targetElement)
                          ? targetElement.GetString()
                          : null;

                      LogScenario($"Interaction[{interactionCount}] Type={type ?? "<null>"} Target={target ?? "<null>"}");
                      if (string.Equals(type, "click", StringComparison.Ordinal) &&
                          string.Equals(target, "SignInButton", StringComparison.Ordinal))
                      {
                          SignInAsStaff();
                      }
                      else if (string.Equals(type, "selectNavigation", StringComparison.Ordinal) &&
                          target is not null)
                      {
                          SelectNavigationTarget(target);
                      }
                      else if (string.Equals(type, "assertProperty", StringComparison.Ordinal) &&
                          string.Equals(target, "CurrentRouteStatusTextBlock", StringComparison.Ordinal) &&
                          interaction.TryGetProperty("key", out var keyElement) &&
                          string.Equals(keyElement.GetString(), "Text", StringComparison.Ordinal) &&
                          interaction.TryGetProperty("parameter", out var parameterElement))
                      {
                          expectedRoute = parameterElement.GetString();
                      }
                  }

                  expectedRoute ??= "signed-out";
                  LogScenario($"InteractionCount={interactionCount}");
                  LogScenario($"ExpectedRoute={expectedRoute}");
                  LogScenario($"FinalRoute={CurrentRouteStatusTextBlock.Text}");
                  if (!string.Equals(CurrentRouteStatusTextBlock.Text, expectedRoute, StringComparison.Ordinal))
                  {
                      throw new InvalidOperationException($"Scenario {scenarioPath} expected route {expectedRoute} but final route was {CurrentRouteStatusTextBlock.Text}.");
                  }
              }

              private void ShowSignedOut()
              {
                  isStaff = false;
                  ContentFrame.Content = null;
                  CurrentRouteStatusTextBlock.Text = "signed-out";
                  AdminNavigationItem.Visibility = Visibility.Collapsed;
                  AdminWorkbenchNavigationItem.Visibility = Visibility.Collapsed;
                  RootNavigation.Visibility = Visibility.Collapsed;
                  SignedOutFrame.Visibility = Visibility.Visible;
              }

              private void OnNavigationSelectionChanged(NavigationView sender, NavigationViewSelectionChangedEventArgs args)
              {
                  if (args.SelectedItemContainer?.Tag is string tag)
                  {
                      Navigate(tag);
                  }
              }

              private void OnLogoutClicked(object sender, RoutedEventArgs args)
              {
                  ShowSignedOut();
              }

              private void Navigate(string tag)
              {
                  var (surfaceKey, pageType) = tag switch
                  {
                      "admin" when isStaff => ("admin", typeof(AdminProbePage)),
                      "admin-workbench" when isStaff => ("admin-workbench", typeof(AdminWorkbenchProbePage)),
                      "messages" => ("messages", typeof(MessagesProbePage)),
                      "status-states" => ("status-states", typeof(StatusStatesProbePage)),
                      "settings-profile" => ("settings-profile", typeof(SettingsProfileProbePage)),
                      _ => ("home", typeof(HomeProbePage))
                  };

                  CurrentRouteStatusTextBlock.Text = surfaceKey;
                  ContentFrame.Navigate(pageType);
              }

              private void SelectNavigationTarget(string target)
              {
                  var tag = target switch
                  {
                      "HomeNavigationItem" => "home",
                      "ChannelsNavigationItem" => "messages",
                      "SettingsNavigationItem" => "status-states",
                      "ProfileNavigationItem" => "settings-profile",
                      "AdminNavigationItem" => "admin",
                      "AdminWorkbenchNavigationItem" => "admin-workbench",
                      _ => "home"
                  };

                  Navigate(tag);
              }

              private static void LogScenario(string message)
              {
                  var launchLog = Environment.GetEnvironmentVariable("WINUI3_MAC_NATIVE_LAUNCH_LOG");
                  if (string.IsNullOrWhiteSpace(launchLog))
                  {
                      return;
                  }

                  try
                  {
                      File.AppendAllText(launchLog, message + Environment.NewLine);
                  }
                  catch
                  {
                      // Best-effort diagnostics only.
                  }
              }
          }
          '@
          Set-Content -Path $mainWindowCodePath -Value $mainWindowCode -Encoding UTF8

      - name: Build capture tool and downstream probe
        working-directory: work/emsi
        run: |
          dotnet build tools/winui3-mac-test-runtime/tools/WindowsWindowCapture/WindowsWindowCapture.csproj --configuration Release
          dotnet build apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/MeetingChallenge.WinUI.MacRuntimeProbe.csproj --configuration Release -p:Platform=x64 -p:EnableDefaultApplicationDefinition=false -p:WindowsAppSDKSelfContained=true

      - name: Capture downstream probe scenarios
        working-directory: work/emsi
        run: |
          $sourceCommit = git rev-parse HEAD
          $runnerImage = $env:ImageVersion
          if ([string]::IsNullOrWhiteSpace($runnerImage)) {
            $runnerImage = $env:ImageOS
          }

          $scenarios = @(
            @{ Name = "login-light"; Path = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/scenarios/login-light.json" },
            @{ Name = "shell-staff-light"; Path = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/scenarios/shell-staff-light.json" },
            @{ Name = "messages-multiline-light"; Path = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/scenarios/messages-multiline-light.json" },
            @{ Name = "admin-dashboard-light"; Path = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/scenarios/admin-dashboard-light.json" },
            @{ Name = "admin-workbench-light"; Path = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/scenarios/admin-workbench-light.json" },
            @{ Name = "command-search-light"; Path = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/scenarios/command-search-light.json" },
            @{ Name = "status-states-light"; Path = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/scenarios/status-states-light.json" },
            @{ Name = "settings-profile-light"; Path = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/scenarios/settings-profile-light.json" }
          )

          $captureTool = "tools/winui3-mac-test-runtime/tools/WindowsWindowCapture/bin/Release/net10.0-windows/WindowsWindowCapture.dll"
          $fixtureProject = "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/MeetingChallenge.WinUI.MacRuntimeProbe.csproj"
          $fixtureExecutable = Get-ChildItem "apps/windows/tests/MeetingChallenge.WinUI.MacRuntimeProbe/bin" -Recurse -Filter "MeetingChallenge.WinUI.MacRuntimeProbe.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $fixtureExecutable) {
            throw "MeetingChallenge.WinUI.MacRuntimeProbe.exe was not found after build."
          }

          foreach ($scenario in $scenarios) {
            $scenarioJson = Get-Content $scenario.Path -Raw | ConvertFrom-Json
            $expectedWidth = [Math]::Min([int]$scenarioJson.viewport.width, 1028)
            $expectedHeight = [int]$scenarioJson.viewport.height
            $viewport = "${expectedWidth}x${expectedHeight}"
            $fixtureScenarioPath = (Resolve-Path $scenario.Path).Path
            $outDir = Join-Path $env:EMSI_EVIDENCE_ROOT "screenshots\$($scenario.Name)"
            New-Item -ItemType Directory -Force $outDir | Out-Null
            $launchLog = Join-Path $outDir "native-launch.log"
            $env:WINUI3_MAC_NATIVE_LAUNCH_LOG = $launchLog
            $expectedRoute = "signed-out"
            foreach ($interaction in $scenarioJson.interactions) {
              if ($interaction.type -eq "assertProperty" -and
                  $interaction.target -eq "CurrentRouteStatusTextBlock" -and
                  $interaction.key -eq "Text" -and
                  -not [string]::IsNullOrWhiteSpace($interaction.parameter)) {
                $expectedRoute = $interaction.parameter
              }
            }

            dotnet $captureTool `
              --title "Meeting Challenge Windows macOS Runtime Probe" `
              --output "$outDir/windows-reference.png" `
              --metadata-output "$outDir/windows-reference.json" `
              --client-area `
              --require-title-match `
              --timeout-seconds 60 `
              --reference-source native-winui `
              --fixture-project $fixtureProject `
              --scenario $scenario.Path `
              --scenario-name $scenario.Name `
              --commit-sha $sourceCommit `
              --workflow-run-id "${{ github.run_id }}" `
              --runner-image $runnerImage `
              --viewport $viewport `
              --scale "$($scenarioJson.scale)" `
              --theme $scenarioJson.theme `
              --settle-ms 2000 `
              -- $fixtureExecutable.FullName --scenario $fixtureScenarioPath

            $captureExitCode = $LASTEXITCODE
            Remove-Item Env:\WINUI3_MAC_NATIVE_LAUNCH_LOG -ErrorAction SilentlyContinue
            if ($captureExitCode -ne 0) {
              if (Test-Path $launchLog) {
                Write-Host "===== Native launch log for $($scenario.Name) ====="
                Get-Content $launchLog -Raw
              }

              Write-Host "===== Recent Application errors for $($scenario.Name) ====="
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-10); Level = 1,2 } -MaxEvents 20 -ErrorAction SilentlyContinue |
                Format-List TimeCreated, ProviderName, Id, LevelDisplayName, Message

              Write-Host "===== Probe executable layout ====="
              Get-ChildItem $fixtureExecutable.DirectoryName -Force |
                Select-Object Name, Length, LastWriteTime |
                Format-Table -AutoSize

              throw "Downstream native WinUI reference capture failed for $($scenario.Name) with exit code $captureExitCode."
            }

            if (-not (Test-Path $launchLog)) {
              throw "Downstream native WinUI reference capture for $($scenario.Name) did not create native launch log."
            }
            $launchLogText = Get-Content $launchLog -Raw
            Write-Host "===== Native launch log for $($scenario.Name) ====="
            Write-Host $launchLogText
            if ($launchLogText -notmatch [regex]::Escape("ExpectedRoute=$expectedRoute")) {
              throw "Downstream native WinUI reference capture for $($scenario.Name) did not report expected route $expectedRoute."
            }
            if ($launchLogText -notmatch [regex]::Escape("FinalRoute=$expectedRoute")) {
              throw "Downstream native WinUI reference capture for $($scenario.Name) did not report expected route $expectedRoute as final route."
            }

            $metadata = Get-Content "$outDir/windows-reference.json" -Raw | ConvertFrom-Json
            if ($metadata.referenceSource -ne "native-winui") {
              throw "Windows reference provenance for $($scenario.Name) was '$($metadata.referenceSource)', expected native-winui."
            }
            if ($metadata.captureMode -ne "client-area") {
              throw "Windows reference capture mode for $($scenario.Name) was '$($metadata.captureMode)', expected client-area."
            }
            if ($metadata.dimensions.width -ne $expectedWidth -or $metadata.dimensions.height -ne $expectedHeight) {
              throw "Windows reference dimensions for $($scenario.Name) were $($metadata.dimensions.width)x$($metadata.dimensions.height), expected $viewport."
            }
          }

      - name: Copy sanitized evidence to emsi_qa
        run: |
          $sourceCommit = git -C work/emsi rev-parse HEAD
          $date = Get-Date -Format 'yyyy-MM-dd'
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $label = ($env:EMSI_QA_LABEL -replace '[^A-Za-z0-9._-]', '-')
          if ([string]::IsNullOrWhiteSpace($label)) { $label = 'downstream-probe' }
          $dest = Join-Path 'work/emsi_qa/windows/probe-screenshots' "$date-$label-$stamp"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$env:EMSI_EVIDENCE_ROOT\screenshots\*" $dest -Recurse -Force
          @"
          # Windows Downstream Probe Screenshots - $date

          Native WinUI client-area reference screenshots for MeetingChallenge.WinUI.MacRuntimeProbe.

          - Source ref: ``$env:EMSI_SOURCE_REF``
          - Source commit: ``$sourceCommit``
          - Runner repo: ``MarlonJD/windows_public_runner``
          - Capture mode: client-area
          - Screenshots: PNG
          - Privacy: screenshots are committed only to the private QA evidence repository.
          "@ | Set-Content -Path (Join-Path $dest 'README.md') -Encoding UTF8

      - name: Commit and push QA evidence
        working-directory: work/emsi_qa
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/probe-screenshots
          if (git diff --cached --quiet) {
            Write-Host 'No QA evidence changes to commit.'
          } else {
            git commit -m "Add Windows downstream probe screenshots"
            git push
          }

      - name: Clean public runner workspace
        if: always()
        run: |
          Remove-Item -Recurse -Force work -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $env:EMSI_EVIDENCE_ROOT -ErrorAction SilentlyContinue
